name: Backend quality gate

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: |
          pytest \
            --cov=api \
            --cov=analyzer \
            --cov=database \
            --cov=emailer \
            --cov=main \
            --cov=pipeline \
            --cov=researcher \
            --cov=scraper \
            --cov=worker \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  container:
    name: Container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t twitter-stock-signals:ci .

      - name: Start container
        run: |
          docker run --detach --rm \
            --name twitter-stock-signals-ci \
            --publish 8000:8000 \
            --env API_KEY=ci-test-key \
            twitter-stock-signals:ci

      - name: Verify health endpoint
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs twitter-stock-signals-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop twitter-stock-signals-ci || true
